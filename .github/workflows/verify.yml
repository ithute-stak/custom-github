name: Verify control plane

on:
  push:
    branches:
      - feature/control-plane-mvp
      - main
  pull_request:
    branches:
      - feature/control-plane-mvp
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: custom_github_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d custom_github_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile Python
        run: python -m compileall -q app tests

      - name: Validate shell scripts
        run: |
          bash -n scripts/start-local.sh
          bash -n scripts/verify-local.sh

      - name: Run regression tests
        env:
          CUSTOM_GITHUB_DATA_DIR: /tmp/custom-github-ci-data
          CUSTOM_GITHUB_WORKSPACE_ROOT: /tmp/custom-github-ci-workspaces
          CUSTOM_GITHUB_TEST_POSTGRES_DSN: postgresql://postgres:postgres@127.0.0.1:5432/custom_github_test
        run: python -m pytest -q tests
