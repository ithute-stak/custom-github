services:
  control-plane:
    build: .
    container_name: custom-github
    restart: unless-stopped
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      CUSTOM_GITHUB_DATA_DIR: /data
      CUSTOM_GITHUB_WORKSPACE_ROOT: /data/workspaces
    volumes:
      - ./data:/data
      - /var/run/docker.sock:/var/run/docker.sock
